<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title desc"><title id="title">Enterprise Active Directory security lab architecture</title><desc id="desc">Isolated VirtualBox network with DC01 and CLIENT01. Domain services, department groups, endpoint GPOs, file shares and security events.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b1730"/><stop offset="1" stop-color="#182d4c"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#061126" flood-opacity=".35"/></filter><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#7fc5e2" stroke-width="1.7"/></marker><style>text{font-family:Arial,Helvetica,sans-serif}.h{fill:#fff;font-size:34px;font-weight:700}.sub{fill:#a6bed8;font-size:17px}.section{fill:#77c9e8;font-weight:700;font-size:17px;letter-spacing:.4px}.name{fill:#f6fbff;font-weight:700;font-size:24px}.small{fill:#cbdded;font-size:17px}.tiny{fill:#9eb8d2;font-size:15px}.chip{fill:#8cd0ea;font-weight:700;font-size:16px}</style></defs><rect width="1400" height="880" fill="url(#bg)"/><text x="70" y="77" class="h">Enterprise Active Directory Security Lab</text><text x="70" y="112" class="sub">Oracle VirtualBox • Isolated CORP-LAB virtual network • 192.168.50.0/24 • November 2026</text><rect x="58" y="152" width="1284" height="372" rx="24" fill="#112743" stroke="#4d7899" stroke-width="2" stroke-dasharray="9 7"/><text x="87" y="188" class="section">ISOLATED VIRTUAL NETWORK · NO PRODUCTION ROUTER OR LAN DHCP</text><rect x="90" y="214" width="542" height="254" rx="18" fill="#1e3c59" stroke="#67aecf" stroke-width="2" filter="url(#shadow)"/><rect x="90" y="214" width="542" height="9" rx="4" fill="#69b4db"/><text x="118" y="269" class="name">DC01 · Domain Controller</text><text x="118" y="302" class="small">Windows Server 2025 Evaluation</text><text x="118" y="331" class="chip">192.168.50.10 / 24 · Static</text><text x="118" y="373" class="small">Active Directory Domain Services · DNS</text><text x="118" y="400" class="small">DHCP · Group Policy · SMB Shares</text><text x="118" y="428" class="small">Windows Security Event Log</text><rect x="768" y="214" width="542" height="254" rx="18" fill="#1d3854" stroke="#77b7d6" stroke-width="2" filter="url(#shadow)"/><rect x="768" y="214" width="542" height="9" rx="4" fill="#a7c7e4"/><text x="797" y="269" class="name">CLIENT01 · Domain Workstation</text><text x="797" y="302" class="small">Windows 11 Enterprise Evaluation</text><text x="797" y="331" class="chip">192.168.50.100 / 24 · DHCP</text><text x="797" y="373" class="small">CORP domain authentication</text><text x="797" y="400" class="small">Workstation GPO enforcement</text><text x="797" y="428" class="small">Access &amp; denied-access tests</text><path d="M632 329H768" stroke="#7fc5e2" stroke-width="3" marker-end="url(#arr)"/><path d="M768 349H632" stroke="#7fc5e2" stroke-width="3" marker-end="url(#arr)"/><text x="699" y="303" text-anchor="middle" class="tiny">AD / DNS / SMB</text><text x="699" y="383" text-anchor="middle" class="tiny">DHCP / GPO</text><path d="M361 468V547M1039 468V547" stroke="#70a6c7" stroke-width="2"/><path d="M244 547H1154" stroke="#70a6c7" stroke-width="2"/><path d="M245 547V567M700 547V567M1155 547V567" stroke="#70a6c7" stroke-width="2"/><rect x="63" y="567" width="364" height="224" rx="18" fill="#193751" stroke="#3f7b9d"/><text x="91" y="614" class="section">IDENTITY &amp; ACCESS</text><text x="91" y="650" class="small">corp.example.test / CORP</text><text x="91" y="679" class="small">30 test users • 4 department groups</text><text x="91" y="707" class="small">Finance • HR • IT • Operations</text><text x="91" y="737" class="small">4 SMB shares + NTFS controls</text><rect x="518" y="567" width="364" height="224" rx="18" fill="#193751" stroke="#3f7b9d"/><text x="546" y="614" class="section">ENDPOINT POLICIES</text><text x="546" y="650" class="small">10-minute workstation lock</text><text x="546" y="679" class="small">Firewall: inbound block / outbound allow</text><text x="546" y="707" class="small">Removable disk: deny write</text><text x="546" y="737" class="small">DC account/group/Kerberos auditing</text><rect x="973" y="567" width="364" height="224" rx="18" fill="#193751" stroke="#3f7b9d"/><text x="1001" y="614" class="section">SECURITY INVESTIGATION</text><text x="1001" y="650" class="small">4720 / 4726 · User lifecycle</text><text x="1001" y="679" class="small">4728 / 4730 · Group changes</text><text x="1001" y="707" class="small">4771 · Kerberos failures</text><text x="1001" y="737" class="small">4740 / 4767 · Lock / unlock</text><text x="70" y="839" class="tiny">Evidence: 107 numbered screenshots · Educational environment only · Not a production security deployment</text></svg>